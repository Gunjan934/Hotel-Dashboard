<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Hotel Reservation</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <a href="{{ url_for('routes.login') }}"
           class="logo">
            Grand Palace Hotel
        </a>

        <div class="nav-links">

            <a href="{{ url_for('routes.register') }}">
                Register
            </a>

        </div>

    </nav>


    <!-- Login -->

    <div class="auth-page">

        <div class="auth-container">

            <div class="auth-header">

                <h1>Welcome Back</h1>

                <p>
                    Login to your hotel account
                </p>

            </div>


            <form
                action="{{ url_for('routes.login') }}"
                method="POST">


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button
                    type="submit"
                    class="primary-btn">

                    Login

                </button>

            </form>


            <p class="login-text">

                Don't have an account?

                <a href="{{ url_for('routes.register') }}">
                    Create an account
                </a>

            </p>

        </div>

    </div>

</body>

</html>
