<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Staff Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <a href="{{ url_for('routes.home') }}"
           class="logo">

            Hotel Reservation System

        </a>


        <div class="nav-links">

            <a href="{{ url_for('routes.home') }}">
                Home
            </a>

            <a href="{{ url_for('routes.login') }}">
                Customer Login
            </a>

            <a href="{{ url_for('routes.register') }}">
                Register
            </a>

        </div>

    </nav>



    <!-- STAFF LOGIN -->

    <div class="auth-page">

        <div class="auth-container">


            <div class="auth-header">

                <h1>
                    Staff Login
                </h1>

                <p>
                    Login to your hotel's staff dashboard.
                </p>

            </div>


            <form method="POST">


                <!-- HOTEL CODE -->

                <div class="form-group">

                    <label for="hotel_code">
                        Hotel Code
                    </label>

                    <input
                        type="text"
                        id="hotel_code"
                        name="hotel_code"
                        placeholder="Enter hotel code"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter staff email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <button type="submit"
                        class="primary-btn">

                    Staff Login

                </button>


            </form>


            <p class="login-text">

                Are you a customer?

                <a href="{{ url_for('routes.login') }}">
                    Customer Login
                </a>

            </p>


        </div>

    </div>


</body>

</html>
