<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hotel Details</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <a href="{{ url_for('routes.staff_dashboard') }}"
           class="logo">

            Hotel Reservation System

        </a>


        <div class="nav-links">

            <a href="{{ url_for('routes.staff_dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('routes.staff_hotel') }}">
                Hotel Details
            </a>

            <a href="{{ url_for('routes.staff_customers') }}">
                Customers
            </a>

            <a href="{{ url_for('routes.staff_bookings') }}">
                Bookings
            </a>

            <a href="{{ url_for('routes.staff_rooms') }}">
                Rooms
            </a>

            <a href="{{ url_for('routes.logout') }}">
                Logout
            </a>

        </div>

    </nav>



    <!-- HOTEL DETAILS -->

    <div class="page-container">


        <div class="dashboard-header">

            <h1>
                Hotel Details
            </h1>

            <p>
                Details of your hotel.
            </p>

        </div>



        <div class="room-card">


            <h3>
                {{ hotel.name }}
            </h3>


            <p>
                <strong>City:</strong>
                {{ hotel.city }}
            </p>


            <p>
                <strong>Address:</strong>
                {{ hotel.address }}
            </p>


            <p>
                <strong>Phone:</strong>
                {{ hotel.phone }}
            </p>


        </div>


        <br>


        <a href="{{ url_for('routes.staff_dashboard') }}"
           class="secondary-btn">

            Back to Dashboard

        </a>


    </div>


</body>

</html>
